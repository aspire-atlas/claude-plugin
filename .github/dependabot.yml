# Dependabot: grouped security and version updates (CVE Remediation, ASP-6055).
# Security fixes for an ecosystem arrive as one PR. Minor and patch version updates arrive as one
# weekly PR. Major version updates still get their own PR, so each breaking change is reviewed alone.
# Security updates always target the default branch (main) and only use an entry that sets no
# target-branch, so they get their own entry (version updates off there). Version updates target
# develop (the beta channel) in the second entry.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
