name: Release gate

# Extra checks that only apply to pull requests into main. Together with
# branch protection (require this check, require PRs, no direct pushes) this is
# what makes "main = official channel" enforceable.
on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source branch must be release/*, develop, or hotfix/*
        run: |
          src="${{ github.head_ref }}"
          case "$src" in
            release/*|develop|hotfix/*) echo "ok: $src" ;;
            *) echo "PRs to main must come from release/*, develop, or hotfix/*, got '$src'"; exit 1 ;;
          esac

      - name: PR must bump the release version
        run: |
          base_ver=$(git show "origin/${{ github.base_ref }}:.claude-plugin/marketplace.json" | jq -r '.plugins[0].version // empty')
          head_ver=$(jq -r '.plugins[0].version // empty' .claude-plugin/marketplace.json)
          echo "main: ${base_ver:-none}  ->  PR: ${head_ver:-none}"
          [[ -n "$head_ver" ]] || { echo "marketplace entry has no version; set plugins[0].version to X.Y.Z"; exit 1; }
          if [[ -n "$base_ver" && "$base_ver" == "$head_ver" ]]; then
            echo "Version unchanged ($head_ver). Bump it in .claude-plugin/marketplace.json."; exit 1
          fi
          if [[ -n "$base_ver" ]]; then
            highest=$(printf '%s\n%s\n' "$base_ver" "$head_ver" | sort -V | tail -1)
            [[ "$highest" == "$head_ver" ]] || { echo "$head_ver is lower than $base_ver"; exit 1; }
          fi

      - name: CHANGELOG has a dated entry for the new version
        run: |
          ver=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          grep -qE "^## \[$ver\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md \
            || { echo "CHANGELOG.md needs '## [$ver] - YYYY-MM-DD'"; exit 1; }
          if grep -A3 '^## \[Unreleased\]' CHANGELOG.md | grep -qE '^- '; then
            echo "Move remaining Unreleased items under [$ver] before releasing"; exit 1
          fi

      - name: Full channel contract for main
        run: bash scripts/check-channel.sh main
