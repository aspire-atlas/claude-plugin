name: Release gate

# Extra checks that only apply to pull requests into main. Together with
# branch protection (require this check, require PRs, no direct pushes) this is
# what makes "main = official channel" enforceable.
on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source branch must be release/*, develop, or hotfix/*
        run: |
          src="${{ github.head_ref }}"
          case "$src" in
            release/*|develop|hotfix/*) echo "ok: $src" ;;
            *) echo "PRs to main must come from release/*, develop, or hotfix/*, got '$src'"; exit 1 ;;
          esac

      - name: Every plugin whose content changed is bumped and has a dated changelog entry
        env:
          BASE: ${{ github.base_ref }}
        run: |
          . scripts/plugins.sh
          git show "origin/$BASE:.claude-plugin/marketplace.json" > "$RUNNER_TEMP/base.json"
          fail=0
          for p in $(plugin_names); do
            src=$(plugin_src "$p")
            base_ver=$(plugin_version "$p" "$RUNNER_TEMP/base.json")
            head_ver=$(plugin_version "$p")
            echo "$p  main: ${base_ver:-none}  ->  PR: ${head_ver:-none}"
            [[ -n "$head_ver" ]] || { echo "FAIL $p: marketplace entry has no version; set it to X.Y.Z"; fail=1; continue; }
            if [[ -n "$base_ver" ]] && git diff --quiet "origin/$BASE" HEAD -- "$src"; then
              # Docs and CI-only PRs may land without a bump.
              release=$([[ "$base_ver" != "$head_ver" ]] && echo true || echo false)
            else
              # Content changed, or the plugin is new on main.
              release=true
              if [[ -n "$base_ver" && "$base_ver" == "$head_ver" ]]; then
                echo "FAIL $p: $src changed but its version is still $head_ver. Bump it in .claude-plugin/marketplace.json."; fail=1
              fi
            fi
            if [[ -n "$base_ver" ]]; then
              highest=$(printf '%s\n%s\n' "$base_ver" "$head_ver" | sort -V | tail -1)
              [[ "$highest" == "$head_ver" ]] || { echo "FAIL $p: $head_ver is lower than $base_ver"; fail=1; }
            fi
            [[ "$release" == true ]] || continue
            cl=$(plugin_changelog "$p")
            grep -qE "^## \[$head_ver\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" "$cl" 2>/dev/null \
              || { echo "FAIL $p: $cl needs '## [$head_ver] - YYYY-MM-DD'"; fail=1; continue; }
            if grep -A3 '^## \[Unreleased\]' "$cl" | grep -qE '^- '; then
              echo "FAIL $p: move the remaining Unreleased items in $cl under [$head_ver] before releasing"; fail=1
            fi
          done
          exit $fail

      - name: Full channel contract for main
        run: bash scripts/check-channel.sh main
