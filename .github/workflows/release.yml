name: Release

# Tags the official channel. Runs on every push to main and cuts a GitHub
# Release for each plugin whose version has no tag yet, so a merged release PR
# is the whole job.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish a GitHub Release for every plugin version not yet tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/plugins.sh
          for p in $(plugin_names); do
            ver=$(plugin_version "$p")
            tag=$(plugin_tag "$p" "$ver")
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already tagged; nothing to do for $p"; continue
            fi

            awk -v v="$ver" '
              $0 ~ "^## \\["v"\\]" {p=1; next}
              p && /^## \[/ {exit}
              p {print}
            ' "$(plugin_changelog "$p")" > "notes-$p.md"
            [[ -s "notes-$p.md" ]] || { echo "No changelog section for $p $ver"; exit 1; }

            src=$(plugin_src "$p")
            (cd "$(dirname "$src")" && zip -qr "$GITHUB_WORKSPACE/$p-$ver.zip" "$(basename "$src")")
            sha256sum "$p-$ver.zip" > "$p-$ver.zip.sha256"

            # The repository's Latest release stays on aspire.
            gh release create "$tag" "$p-$ver.zip" "$p-$ver.zip.sha256" \
              --target "$GITHUB_SHA" --title "$p v$ver" --notes-file "notes-$p.md" \
              --latest="$([[ "$p" == aspire ]] && echo true || echo false)"

            # Dependency version ranges resolve against <plugin>--vX.Y.Z tags;
            # aspire's releases keep their vX.Y.Z tag and get this one as well.
            if [[ "$tag" != "$p--v$ver" ]]; then
              git tag "$p--v$ver" "$GITHUB_SHA"
              git push origin "refs/tags/$p--v$ver"
            fi
          done
