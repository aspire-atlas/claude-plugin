name: Validate

# Runs on every push and PR. Structural validation plus the channel contract
# for the branch being built or targeted.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The nightly page eval on develop (the eval job). A schedule fires from the default branch's copy of this file.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for the version gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin
        run: |
          for d in plugins/*/; do
            echo "== $d"
            claude plugin validate "$d"
          done

      - name: Resolve channel
        id: channel
        run: |
          # PRs are checked against the branch they will land on.
          target="${{ github.base_ref || github.ref_name }}"
          case "$target" in
            main) echo "name=main" >> "$GITHUB_OUTPUT" ;;
            develop) echo "name=develop" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=develop" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Checking channel contract for: $target"

      - name: Channel contract (names, pinning, CHANGELOG, version bump)
        run: bash scripts/check-channel.sh "${{ steps.channel.outputs.name }}"

      - name: Atlas tool contract (tool names, removed arguments, marketplace filters)
        run: bash scripts/check-tool-contract.sh

      - name: Every agent is listed in its plugin (skill, README, agents panel)
        run: bash scripts/check-agent-roster.sh

      - name: Every agent and page reference links the artifact standard
        run: bash scripts/check-artifact-standard.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: The UX review's renderer (scripts/render-page.ts) draws the fixture page in all three views
        run: |
          # Playwright is the renderer's one dependency. It is installed here rather than in package.json: the renderer
          # is a repository script that no plugin ships.
          # The renderer drives the runner image's own Chrome: Playwright cannot install its Chromium on every
          # runner OS (ubuntu-latest moved to a release it does not support yet).
          npm install --no-save --no-package-lock playwright@1.56.1
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME_PATH" ]; then echo "::error::No Chrome on the runner for the renderer"; exit 1; fi
          echo "Rendering with $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" bun scripts/render-page.ts

      - name: Every agent carries the orchestration contract and has a permission level
        run: bash scripts/check-orchestration.sh

      - name: Every agent and skill spec follows the spec format
        run: bash scripts/check-agent-specs.sh

      - name: Every color in the mod's hooks comes from the palette
        run: bash scripts/check-palette.sh

      - name: No $<digit> or $ARGUMENTS in a skill or command body (argument substitution)
        run: bash scripts/check-skill-args.sh

      - name: What the plugin directory's scan blocks (mod form, file size, hook docs), and skill description length
        run: bash scripts/check-directory.sh

      - name: The skill layout check gives every fixture its result
        run: bash scripts/check-skill-layout.sh --fixtures

      - name: Skill layout (SKILL.md length, description length, reference chains, tables of contents)
        run: bash scripts/check-skill-layout.sh --tree

      - name: The agent standard check gives every fixture its result
        run: bash scripts/check-agent-standard.sh --fixtures

      - name: Agent standard (metrics row, inline images and cards, R11 words in page copy)
        run: bash scripts/check-agent-standard.sh --tree

      # TODO(ASP-4093, ASP-5295, ASP-5385): advisory until agent descriptions are trimmed, the flows
      # point at page-standard's Data freshness rule, and scripts/eval/questions.json carries the
      # "agents" map. Drop continue-on-error once --advisory passes, and move the items into --tree.
      - name: Agent standard, advisory (description, freshness pointer, eval question)
        continue-on-error: true
        run: bash scripts/check-agent-standard.sh --advisory

      # A throwaway agent, scaffolded on a temporary branch and checked as generated, so the templates in
      # scripts/templates/ cannot drift from the checks. The remove at the end must leave the tree as it was.
      - name: A scaffolded agent passes every check unchanged (scripts/new-agent.sh)
        run: |
          git switch -q -c ci/new-agent-scaffold
          bash scripts/new-agent.sh ci-scaffold --codes I1,O1 --permission write
          claude plugin validate .
          for d in plugins/*/; do claude plugin validate "$d"; done
          # check-channel.sh is left out: the scaffold changes no channel line, and on main it would read
          # the scaffold as plugin content changed since the release tag.
          for s in scripts/check-*.sh; do
            [ "$s" = scripts/check-channel.sh ] && continue
            echo "== $s"; bash "$s"
          done
          # The advisory items still fail on older agents; the scaffold must pass them too.
          if bash scripts/check-agent-standard.sh --advisory | grep -F ci-scaffold; then
            echo "::error::The scaffolded agent fails an advisory item of check-agent-standard.sh"; exit 1
          fi
          claude plugin test plugins/aspire-mod
          bash scripts/new-agent.sh --remove ci-scaffold
          if [ -n "$(git status --porcelain)" ]; then
            git status --short; echo "::error::new-agent.sh --remove left the tree changed"; exit 1
          fi
          # checkout, not switch: a pull request's checkout is a detached HEAD, which switch refuses.
          git checkout -q -

      - name: Changelogs are edited only on release branches
        if: steps.channel.outputs.name == 'develop'
        run: |
          # develop must never touch a plugin's changelog; release/* branches own them.
          # This keeps develop -> release merges conflict-free.
          git fetch -q origin main || { echo "no main yet; skipping"; exit 0; }
          . scripts/plugins.sh
          base=$(git merge-base origin/main HEAD)
          fail=0
          for p in $(plugin_names); do
            cl=$(plugin_changelog "$p")
            if ! git diff --quiet "$base" HEAD -- "$cl" && ! git diff --quiet origin/main HEAD -- "$cl"; then
              echo "$cl changed on develop. Write release notes on the release/* branch instead (or sync it to main's copy)."; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "ok"
          exit $fail

      - name: Scan for credential patterns
        run: |
          if grep -rniE '(api[_-]?key|secret|password|bearer)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_\-]{12,}' plugins/ ; then
            echo "Possible credential found"; exit 1
          fi
          echo "clean"

  # The page eval (scripts/eval/README.md, "In CI"). On a pull request it reruns only the questions the changed
  # agents and flow files answer, posts the table as one comment edited in place, and fails only on a regression:
  # a check the approved page passes that the new page fails. Nightly it reruns all seven on develop and posts to
  # Slack. Pages it publishes are titled "CI eval" and deleted at the end of the run.
  eval:
    needs: validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # A pull request reruns the questions its files answer, and all seven when it touches a shared path such as the
    # page standard, the same work as the nightly run, so both get its limit. Questions run one after another.
    timeout-minutes: 240
    # A new push to a pull request cancels the eval still running for the old one. Only this job: push runs of
    # validate on main and develop must never cancel one another.
    concurrency:
      group: eval-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.base_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      HAS_SECRETS: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.EVAL_LOCAL_JSON != '' && secrets.ATLAS_EVAL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The nightly run grades develop, whichever branch the schedule fired from.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'develop' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Choose the questions
        id: pick
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "codes=$(jq -r '[.questions[].code] | join(",")' scripts/eval/questions.json)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Labels and body are read now, not from the event, so "Re-run jobs" after adding skip-eval sees it.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          if jq -e '[.labels[].name] | index("skip-eval")' "$RUNNER_TEMP/pr.json" >/dev/null; then
            # The reason is the PR body's "skip-eval: <reason>" line.
            reason=$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json" | sed -n 's/^[[:space:]]*skip-eval:[[:space:]]*//p' | awk 'NR==1' | tr -d '\r')
            if [ -z "$reason" ]; then
              echo "::error::The skip-eval label needs a 'skip-eval: <reason>' line in the PR body."; exit 1
            fi
            echo "skip=$reason" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/changed.txt"
          echo "codes=$(bun scripts/eval/ci.ts select "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Post the skip
        if: steps.pick.outputs.skip != ''
        env:
          REASON: ${{ steps.pick.outputs.skip }}
        run: |
          bun scripts/eval/ci.ts skipped "$REASON" > "$RUNNER_TEMP/comment.md"
          # A pull request from a fork has a read-only token: the skip still holds without the comment.
          bash scripts/eval/post-comment.sh "$PR" "$RUNNER_TEMP/comment.md" || echo "::warning::Could not post the skip comment."

      - name: Nothing to rerun
        if: github.event_name == 'pull_request' && steps.pick.outputs.skip == '' && steps.pick.outputs.codes == ''
        run: |
          echo "No agent or flow file that an eval question answers changed; nothing to rerun."
          # An earlier table on this PR no longer describes it; say so instead of leaving it up.
          bun scripts/eval/ci.ts skipped "no file an eval question answers differs from the base branch now" > "$RUNNER_TEMP/comment.md"
          bash scripts/eval/post-comment.sh --if-exists "$PR" "$RUNNER_TEMP/comment.md" || echo "::warning::Could not update the comment."

      - name: Secrets are missing
        if: steps.pick.outputs.codes != '' && env.HAS_SECRETS != 'true'
        run: |
          # A pull request from a fork gets no secrets. A maintainer reruns it from a branch here.
          echo "::warning::ANTHROPIC_API_KEY, ATLAS_EVAL_TOKEN or EVAL_LOCAL_JSON is not set: the page eval did not run."

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.codes != '' && env.HAS_SECRETS == 'true'
        with:
          node-version: 22

      - name: Rerun the questions
        id: run
        if: steps.pick.outputs.codes != '' && env.HAS_SECRETS == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_EVAL_TOKEN: ${{ secrets.ATLAS_EVAL_TOKEN }}
          EVAL_LOCAL_JSON: ${{ secrets.EVAL_LOCAL_JSON }}
          CODES: ${{ steps.pick.outputs.codes }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # Brands and the dev server address are customer details: they come from a secret, never the repository.
          printf '%s' "$EVAL_LOCAL_JSON" > scripts/eval/local.json
          bun run eval:pages --only "$CODES" --out "$RUNNER_TEMP/eval-run" --approved-from newest \
            --title-prefix "CI eval" --cleanup --timeout-min 15
          # The run holds pages and brand names; this repository is public, so none of it is uploaded.

      - name: Post the table
        id: report
        if: steps.pick.outputs.codes != '' && env.HAS_SECRETS == 'true'
        run: |
          set +e
          bun scripts/eval/ci.ts comment "$RUNNER_TEMP/eval-run" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash scripts/eval/post-comment.sh "$PR" "$RUNNER_TEMP/comment.md"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: github.event_name != 'pull_request' && steps.pick.outputs.codes != '' && env.HAS_SECRETS == 'true' && always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.EVAL_SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "::warning::EVAL_SLACK_WEBHOOK_URL is not set; skipping Slack"; exit 0; fi
          bun scripts/eval/ci.ts slack "$RUNNER_TEMP/eval-run" "$RUN_URL" > "$RUNNER_TEMP/slack.json" || true
          [ -s "$RUNNER_TEMP/slack.json" ] || printf '{"text":"Atlas page eval, nightly on develop: the run stopped before any question finished. %s"}' "$RUN_URL" > "$RUNNER_TEMP/slack.json"
          curl -fsS -X POST -H 'Content-type: application/json' --data @"$RUNNER_TEMP/slack.json" "$SLACK_WEBHOOK_URL"

      - name: Fail on a regression
        if: steps.report.outputs.status != '' && steps.report.outputs.status != '0'
        run: |
          if [ "${{ steps.report.outputs.status }}" = 1 ]; then
            echo "::error::A check the approved page passes now fails. The table is in the PR comment and the job summary."
          else
            echo "::error::The eval run stopped before any question finished. See the 'Rerun the questions' step."
          fi
          exit 1
