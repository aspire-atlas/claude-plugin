<svg xmlns="http://www.w3.org/2000/svg" class="sp" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Loading"><style>
.sp{--s-bg:var(--spinner-bg,#1c2b2a);--s-fg:var(--spinner-color,var(--brand,#C8E36B));--s-glyph:var(--spinner-glyph,#fff)}
@media (prefers-color-scheme:light){.sp{--s-bg:var(--spinner-bg-light,var(--spinner-bg,#EEF3DC));--s-fg:var(--spinner-color-light,var(--spinner-color,var(--brand,#4F6F0F)));--s-glyph:var(--spinner-glyph-light,var(--spinner-glyph,#152022))}}
[data-theme="dark"] .sp{--s-bg:var(--spinner-bg,#1c2b2a);--s-fg:var(--spinner-color,var(--brand,#C8E36B));--s-glyph:var(--spinner-glyph,#fff)}
[data-theme="light"] .sp{--s-bg:var(--spinner-bg-light,var(--spinner-bg,#EEF3DC));--s-fg:var(--spinner-color-light,var(--spinner-color,var(--brand,#4F6F0F)));--s-glyph:var(--spinner-glyph-light,var(--spinner-glyph,#152022))}
.bk{fill:var(--s-bg)}.bb{fill:var(--s-fg);opacity:.2}.bg{fill:var(--s-fg)}
.bg path{animation:bp 0.8s linear infinite both}
@keyframes bp{0%{opacity:1}4%{opacity:1}50%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.bg path{animation:none;opacity:0}.bg path:nth-child(-n+3),.bg path:nth-child(n+19):nth-child(-n+21){opacity:1}}</style>
